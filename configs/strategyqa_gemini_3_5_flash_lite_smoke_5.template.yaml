# OFFLINE TEMPLATE ONLY.
# Fill the account-specific RPM, TPM, and RPD values from Google AI Studio
# before copying this file to a runnable .yaml configuration.

run_name: "strategyqa_gemini_3_5_flash_lite_smoke_5_template_only"
dataset_path: "data/prepared/strategyqa_5.jsonl"
output_dir: "data/runs"
task_profile: "strategyqa"

model:
  provider: "gemini"
  name: "gemini-3.5-flash-lite"
  prompt_id: "strategyqa_cot_steps_v1"
  temperature: 0.2
  max_output_tokens: 800

execution:
  metrics_enabled: true
  max_concurrency: 1
  generation_chunk_size: 5
  candidate_chunk_size: 5
  nli_batch_size: 32
  metrics_flush_interval_events: 1
  request_timeout_seconds: 120.0
  max_retries: 2
  retry_base_delay_seconds: 1.0
  retry_jitter_fraction: 0.2
  gemini_requests_per_minute: null
  gemini_tokens_per_minute: null
  gemini_requests_per_day: null
  rate_limit_headroom_fraction: 0.2

scoring:
  risk_threshold: 0.20
  improvement_threshold: 0.02
  max_iters: 2
  risk_formula: "weighted"
  verifier_weight: 0.75
  contradiction_weight: 0.25

repair_acceptance:
  mode: "risk_only"
  support_tolerance: 0.05
  max_regression_risk: 0.35
